# 원본(rpa-designer) 변경 파일 → 점검해야 할 문서 페이지 매핑.
# scripts/source_diff.py 가 이 표로 변경 파일을 분류한다. 위에서부터 첫 번째로 일치하는 규칙을 적용한다.
# glob 은 원본 저장소 루트 기준, '/' 구분자. fnmatch 규칙(** 는 임의 깊이).
rules:
- name: 원격 데스크톱
  globs:
  - NeoRPA.RemoteRuntime/**
  - NeoRPA.RdpPlugin/**
  - NeoRPA.Rdp.Common/**
  - ActivityLibraries/MeetupActivityLibrary/Activities/Helpers/Managers/Rdp*.cs
  - ActivityLibraries/MeetupActivityLibrary/Activities/Helpers/Managers/RemoteRunner.cs
  - ActivityLibraries/MeetupActivityLibrary/Activities/Helpers/NativeHost/RemoteRuntimeService.cs
  docs:
  - docs/user/remote-desktop.md
  - docs/user/troubleshooting.md (원격 데스크톱)
  - docs/glossary.md
- name: 셀렉터·요소 편집기
  globs:
  - ActivityLibraries/MeetupActivityLibrary/Activities/UI/**
  - ActivityLibraries/MeetupActivityLibrary/Activities/Helpers/Managers/ElementFinder*.cs
  - ActivityLibraries/MeetupActivityLibrary/Activities/Helpers/Managers/Selector*.cs
  - ActivityLibraries/MeetupActivityLibrary/Activities/Helpers/Selector*.cs
  - ActivityLibraries/MeetupActivityLibrary/Activities/Helpers/ElementEditor/**
  - RehostedDesigner/Helpers/ElementHighlighter.cs
  docs:
  - docs/user/concepts.md (셀렉터)
  - docs/user/troubleshooting.md (셀렉터)
  - docs/user/remote-desktop.md (요소 지시)
- name: 브라우저 확장·네이티브 메시징
  globs:
  - ActivityLibraries/MeetupActivityLibrary/Activities/Helpers/Managers/PipelineManager.cs
  - ActivityLibraries/MeetupActivityLibrary/Activities/Helpers/NativeHost/**
  - RehostedDesigner/Resources/LocalFiles/**
  - RehostedDesigner/Resources/Batch/**
  docs:
  - docs/user/getting-started.md (로컬 파일 배포, 브라우저 확장)
  - docs/user/troubleshooting.md (브라우저 확장)
- name: 실행·디버깅·로그
  globs:
  - RehostedDesigner/Views/DebugView*
  - RehostedDesigner/Views/DebugPreparationWindow*
  - RehostedDesigner/Views/SubPopup/LogUserControl*
  - RehostedDesigner/Helpers/DebugManager*.cs
  - RehostedDesigner/Helpers/WorkflowExecutor.cs
  - RehostedDesigner/Helpers/Breakpoint*.cs
  - RehostedDesigner/Services/**
  - ActivityLibraries/MeetupActivityLibrary/Activities/Meetup/LogService/**
  docs:
  - docs/user/concepts.md (실행과 디버그)
  - docs/user/troubleshooting.md (로그)
- name: 데이터 스크래핑
  globs:
  - RehostedDesigner/Views/Scrapping/**
  docs:
  - docs/user/activities/chrome-native.md (ExtractDataBrowserNative desc)
  - docs/user/concepts.md
- name: 시작 화면·프로젝트
  globs:
  - RehostedDesigner/Views/Start/**
  - RehostedDesigner/Views/NewProjectWindow*
  - RehostedDesigner/Views/ProjectSettingsWindow*
  - RehostedDesigner/Views/Project/**
  - RehostedDesigner/Helpers/Project*.cs
  - RehostedDesigner/Helpers/RecentProjectStore.cs
  docs:
  - docs/user/getting-started.md
  - docs/user/concepts.md (프로젝트와 워크플로)
- name: 명령줄
  globs:
  - RehostedDesigner/Helpers/CommandLine.cs
  - RehostedDesigner/App.xaml.cs
  - NeoRPA.Executor/**
  docs:
  - docs/user/getting-started.md (명령줄 절)
- name: 표시명 리소스
  globs:
  - ActivityLibraries/MeetupActivityLibrary/Properties/Resources*.resx
  - RehostedDesigner/Properties/Resources*.resx
  docs:
  - docs/user/activities/*.md (재생성으로 자동 반영)
  - docs/glossary.md
- name: 설치·버전
  globs:
  - RehostedDesignerInstaller/**
  - RehostedDesigner/Properties/AssemblyInfo.cs
  docs:
  - docs/user/getting-started.md (설치)
  - docs/changelog.md
- name: 액티비티 목록·속성
  globs:
  - RehostedDesigner/Helpers/ToolboxManager.cs
  - ActivityLibraries/*/Activities/**/*.cs
  - ActivityLibraries/*/*.csproj
  docs:
  - data/activities.yaml → python scripts/gen_activities.py --check / --write
  note: 디자이너(*.xaml, *.xaml.cs) 변경은 속성 편집 UI 변경이므로 desc 문구 점검
- name: 내부 문서(참고 자료)
  globs:
  - docs/**
  - '*.md'
  - '*/CLAUDE.md'
  docs:
  - (문서 작성 참고용 — 사용자 문서 변경 없음)
ignore:
- '**/bin/**'
- '**/obj/**'
- '**/*.Tests/**'
- packages/**
- .vs/**
- UpgradeLog*.htm
- '**/*.csproj.user'
