meta:
  description: NeoRPA 액티비티 문서의 한국어 설명 데이터. 표시명·속성 목록은 소스에서 자동 추출되므로 여기에는 설명만 둔다.
  type_id_overrides:
    System.Activities.Statements.ForEach<>: ForEach_WF
  hidden_categories:
  - Misc
  index_notes: "!!! tip \"Excel WorkBook vs Excel Scope\"\n    이름이 비슷한 액티비티가 두 카테고리에 있습니다. 차이(스코프 유무·사용 시점)는 각 카테고리 개요에서 설명합니다."
common_props:
  AddHeader: 첫 행을 열 머리글로 포함할지 여부.
  AfterTimeout: 동작을 마친 뒤 추가로 대기할 시간(밀리초).
  ApplicationWindow: 연결하거나 새로 연 애플리케이션 창(프로세스)을 담는 변수.
  Arguments: 호출 대상에 전달하거나 로그에 추가할 인자 모음(이름-값).
  AttrName: 읽어올 요소 속성(attribute)의 이름.
  BeforeTimeout: 동작을 시작하기 전에 대기할 시간(밀리초).
  BrowserType: 동작에 사용할 브라우저 종류(Chrome, Edge 등).
  ClickAction: 클릭 동작의 종류(단일 클릭, 더블 클릭 등).
  ClickBeforeTyping: 텍스트를 입력하기 전에 대상 요소를 먼저 클릭할지 여부.
  ClickPosition: 요소 영역 안에서 클릭 기준으로 삼을 지점(가운데, 좌상단 등).
  Column: 대상이 되는 DataTable 열(DataColumn 개체).
  ColumnIndex: 대상 열의 인덱스(0부터 시작).
  ColumnName: 대상 열의 이름.
  ContinueOnError: 이 액티비티에서 오류가 발생해도 워크플로를 멈추지 않고 계속 진행할지 여부(true/false).
  DataTable: 작업 대상이 되는 DataTable.
  DestinationSheet: 대상 시트 이름.
  EmptyField: 입력하기 전에 대상 필드를 비울지 여부.
  FileName: 대상 파일의 이름 또는 경로.
  Mode: 수행할 동작의 모드(삽입/삭제, 읽기 방향 등).
  MouseButton: 클릭에 사용할 마우스 버튼(왼쪽/오른쪽/가운데).
  OffsetX: 클릭 기준점에서 가로로 이동할 오프셋(픽셀).
  OffsetY: 클릭 기준점에서 세로로 이동할 오프셋(픽셀).
  Output: 실행 결과 개체(출력).
  ReadyState: '동작을 실행하기 전에 기다릴 페이지 로딩 상태(예: INTERACTIVE, COMPLETE).'
  RectArea: 대상 요소의 화면상 사각 영역(경계 좌표).
  Result: 액티비티 실행 결과(출력).
  Selector: 동작 대상 UI 요소를 식별하는 셀렉터.
  Timeout: 대상을 찾기까지 대기할 최대 시간(밀리초).
  Value: 대상 요소에 입력할 텍스트.
  WaitTimeout: 대상 요소를 찾기까지 대기할 최대 시간(밀리초).
  autoSave: 작업 후 워크북을 자동 저장할지 여부.
  cell: '대상 셀 위치(예: A1).'
  color: 셀 색상.
  columnName: 대상 열 이름.
  columnNo: 대상 열 번호(또는 열 문자).
  dataTable: 작업 대상이 되는 DataTable.
  filePath: 대상 엑셀 파일의 경로.
  output: 실행 결과를 담을 변수(출력).
  path: 대상 파일 또는 폴더의 경로.
  position: 삽입하거나 읽을 대상 위치(행/열 번호).
  range: '대상 셀 범위(예: A1:C10).'
  result: 읽어온 결과(출력).
  rowNo: 대상 행 번호.
  sheetName: 대상 시트 이름.
  table: 대상 테이블(DataTable 또는 테이블 이름).
  tableName: 대상 테이블 이름.
  value: 기록하거나 조회할 값.
  UseSimulator: 시뮬레이터(백그라운드 입력) 방식으로 동작할지 여부.
  Collection: 반복 처리할 대상 컬렉션.
  Index: 현재 반복 항목의 인덱스(출력, 0부터 시작).
  SecureValue: '보호된 값(SecureString). 자격 증명 가져오기(GetCredential)의 SecurePassword 출력을 연결하면 값이 워크플로 파일·로그에 남지 않습니다. 있으면 평문 인자보다 우선합니다.'
  SecurePassword: '보호된 비밀번호(SecureString). 자격 증명 가져오기(GetCredential)의 SecurePassword 출력을 연결합니다. 있으면 평문 비밀번호보다 우선합니다.'
  SecureConn: '보호된 연결 문자열(SecureString). 자격 증명 관리자에 연결 문자열 전체를 비밀번호로 저장해 두고 자격 증명 가져오기(GetCredential)로 읽어 연결합니다. 있으면 평문 연결 문자열(conn)보다 우선합니다.'
  SelectedType: '비교에 쓸 값의 형식(문자열·정수 등). 식의 값과 케이스 값을 이 형식으로 비교합니다.'
categories:
- key: chrome
  name: Chrome
  title: Chrome (전용)
  summary: 전용 크롬(CDP) 자동화
  intro: 디버그 포트(CDP) 기반 전용 크롬 자동화. 브라우저를 NeoRPA가 직접 띄워 제어합니다.
  namespace_hint:
  - MeetupWfIntro.MeetupActivityLibrary.Activities.Meetup
  - DX.TEST.Activities
  activities:
    OpenChrome:
      desc: 지정한 URL을 크롬(또는 엣지) 브라우저로 엽니다. 브라우저 자동화의 시작점으로 사용합니다.
      props:
        Url:
          desc: 열거나 이동할 웹 페이지 주소.
    OpenBrowser:
      desc: URL을 브라우저로 열고, 그 브라우저를 대상으로 하는 자식 액티비티들을 본문(스코프)에 담는 컨테이너입니다. 본문 액티비티는 대상 창을 따로 지정하지 않아도 이 브라우저에 동작합니다.
      props:
        Url:
          desc: 열거나 이동할 웹 페이지 주소.
    AttachBrowserScope:
      desc: 이미 열려 있는 브라우저 창에 연결하는 스코프입니다. 본문에 놓인 자식 액티비티가 그 브라우저를 대상으로 동작합니다.
    AttachChrome:
      desc: 이미 실행 중인 크롬 창(탭)에 연결해 이후 크롬 액티비티의 대상으로 삼습니다.
      props:
        TabTitle:
          desc: 연결할 브라우저 탭의 제목.
    ClickChrome:
      desc: 크롬 페이지에서 셀렉터로 지정한 웹 요소를 클릭합니다.
      props:
        UseSimulator:
          desc: 시뮬레이터(백그라운드 입력) 방식으로 동작할지 여부.
    HoverChrome:
      desc: 크롬 페이지에서 셀렉터로 지정한 웹 요소 위로 마우스를 올립니다.
    TypeIntoChrome:
      desc: 크롬 페이지의 입력 요소에 텍스트를 입력합니다.
    GetTextChrome:
      desc: 크롬 페이지에서 셀렉터로 지정한 웹 요소의 텍스트를 읽어 반환합니다.
    GetAttributeChrome:
      desc: 크롬 페이지 웹 요소의 지정한 속성(attribute) 값을 읽어 반환합니다.
    ElementExistsChrome:
      desc: 크롬 페이지에 셀렉터로 지정한 웹 요소가 존재하는지 확인해 참/거짓을 반환합니다.
- key: chrome-native
  name: Chrome (일반)
  title: Chrome (일반)
  summary: 사용자 프로필 크롬(네이티브 메시징)
  intro: 사용자 프로필 크롬을 확장 프로그램 + 네이티브 메시징으로 자동화합니다(디버그 포트 미사용).
  namespace_hint:
  - MeetupWfIntro.MeetupActivityLibrary.Activities.Meetup
  - DX.TEST.Activities
  activities:
    AttachBrowserNative:
      desc: 사용자가 평소 쓰는 일반 크롬(확장 프로그램 채널)에 연결해 이후 일반 크롬 액티비티의 대상으로 삼습니다.
      props:
        TabTitle:
          desc: 연결할 브라우저 탭의 제목.
    ClickBrowserNative:
      desc: 일반 크롬 페이지에서 셀렉터로 지정한 웹 요소를 클릭합니다.
    HoverBrowserNative:
      desc: 일반 크롬 페이지에서 셀렉터로 지정한 웹 요소 위로 마우스를 올립니다.
    TypeIntoBrowserNative:
      desc: 일반 크롬 페이지의 입력 요소에 텍스트를 입력합니다.
    GetTextBrowserNative:
      desc: 일반 크롬 페이지에서 셀렉터로 지정한 웹 요소의 텍스트를 읽어 반환합니다.
    GetAttributeBrowserNative:
      desc: 일반 크롬 페이지 웹 요소의 지정한 속성(attribute) 값을 읽어 반환합니다.
    ElementExistsBrowserNative:
      desc: 일반 크롬 페이지에 셀렉터로 지정한 웹 요소가 존재하는지 확인해 참/거짓을 반환합니다.
    ExtractDataBrowserNative:
      desc: 일반 크롬 페이지의 표/목록에서 여러 행 데이터를 DataTable로 추출합니다. 다음 링크를 지정하면 페이지를 넘겨 가며 여러 페이지를 누적 추출합니다.
      props:
        MaxCount:
          desc: 추출할 최대 항목(행) 수.
        NextLink:
          desc: 다음 페이지로 이동하는 링크/버튼을 식별하는 셀렉터.
        NextLinkTimeout:
          desc: 다음 링크를 클릭하기 전에 대기할 시간(밀리초).
        MetaData:
          desc: 추출할 데이터의 구조(열 구성 등)를 정의하는 메타데이터.
        OutDataTable:
          desc: 추출 결과를 담는 DataTable(출력).
- key: control
  name: Control
  title: Control (데스크톱 UI · 파일 · 프로세스)
  summary: 데스크톱 UI 자동화 + 파일·프로세스·클립보드·코드 실행
  intro: 데스크톱 애플리케이션 UI 자동화(셀렉터·이미지·OCR)와 파일·클립보드·프로세스·코드 실행 유틸.
  namespace_hint:
  - DX.TEST.Activities
  - MeetupWfIntro.MeetupActivityLibrary.Activities.Meetup
  activities:
    AttachWindowScope:
      desc: 이미 열려 있는 데스크톱 창에 연결하는 스코프입니다. 본문에 놓인 자식 액티비티가 그 창을 대상으로 동작합니다.
    AttachWindow:
      desc: 이미 실행 중인 데스크톱 애플리케이션 창에 연결해 이후 UI 액티비티의 대상으로 삼습니다.
    TypeInto:
      desc: 셀렉터로 지정한 입력 요소에 텍스트를 입력합니다. 특수키 토큰(`[k(enter)]` 등)·입력 방식(하드웨어/시뮬레이트)·기존 값 비우기를 지원합니다.
      props:
        UseSendKey:
          desc: SendKeys 방식으로 키를 전송할지 여부.
        InputMethod:
          desc: 텍스트 입력 방식(하드웨어 이벤트, 윈도우 메시지 등).
        DelayBetweenKeys:
          desc: 키 입력 사이에 둘 지연 시간(밀리초).
        ClearMethod:
          desc: 입력 전에 기존 필드 내용을 지우는 방식.
    Click:
      desc: 셀렉터로 지정한 요소를 클릭합니다. 좌/우/더블 클릭, 시뮬레이터(백그라운드) 클릭과 물리 클릭을 지원합니다.
      props:
        UseSimulator:
          desc: 시뮬레이터(백그라운드 입력) 방식으로 동작할지 여부.
    ClickVision:
      desc: OCR/비전 하이브리드로 화면의 텍스트·요소를 찾아 클릭합니다.
      props:
        TargetText:
          desc: 화면 비전으로 찾을 대상의 텍스트.
        AnchorText:
          desc: 대상 요소를 찾을 때 기준점으로 삼는 주변 텍스트.
        AnchorPosition:
          desc: 앵커 텍스트를 기준으로 대상이 위치한 방향(위/아래/좌/우 등).
        ImageCropPath:
          desc: 비전 매칭에 사용할 크롭 이미지 파일 경로.
        OcrConfidence:
          desc: OCR 텍스트 인식의 최소 신뢰도(0~1).
        ImageThreshold:
          desc: 이미지 매칭 임계값(0~1, 높을수록 엄격하게 일치).
    ImageClick:
      desc: 화면에서 지정한 이미지와 일치하는 위치를 찾아 클릭합니다.
      props:
        SearchTimeout:
          desc: 대상 이미지를 찾기까지 대기할 최대 시간(밀리초).
        Similarity:
          desc: 이미지 매칭 유사도(백분율, 높을수록 엄격하게 일치).
    ImageExists:
      desc: 화면에 지정한 이미지가 존재하는지 확인해 참/거짓을 반환합니다.
      props:
        SearchTimeout:
          desc: 대상 이미지를 찾기까지 대기할 최대 시간(밀리초).
        Similarity:
          desc: 이미지 매칭 유사도(백분율, 높을수록 엄격하게 일치).
    Hover:
      desc: 셀렉터로 지정한 요소 위로 마우스를 올립니다.
    GetText:
      desc: 셀렉터로 지정한 요소의 텍스트를 읽어 반환합니다.
    GetAttribute:
      desc: 셀렉터로 지정한 요소의 지정한 속성(attribute) 값을 읽어 반환합니다.
      props:
        Attributes:
          desc: 요소의 모든 속성을 이름-값 사전으로 담는 출력.
    Hotkey:
      desc: 지정한 단축키(조합 키)를 대상 요소나 창에 전송합니다.
      props:
        Alt:
          desc: 단축키에 Alt 키를 함께 누를지 여부.
        Ctrl:
          desc: 단축키에 Ctrl 키를 함께 누를지 여부.
        Shift:
          desc: 단축키에 Shift 키를 함께 누를지 여부.
        Win:
          desc: 단축키에 Windows 키를 함께 누를지 여부.
        SpecialKey:
          desc: 일반 문자 대신 특수 키(기능 키 등)를 입력할지 여부.
        InputDelay:
          desc: 각 키 입력 사이에 둘 지연 시간(밀리초).
        Key:
          desc: 누를 주 키.
    ElementExists:
      desc: 셀렉터로 지정한 요소가 화면에 존재하는지 확인해 참/거짓을 반환합니다.
      props:
        TimeOut:
          desc: 대상 요소를 찾기까지 대기할 최대 시간(밀리초).
        IsExist:
          desc: 대상 요소의 존재 여부(출력).
    TakeScreenshot:
      desc: 화면 전체 또는 지정한 요소/영역을 캡처해 이미지로 가져옵니다.
      props:
        Screenshot:
          desc: 캡처한 스크린샷 이미지(출력).
    SaveImage:
      desc: 이미지를 지정한 경로에 파일로 저장합니다.
      props:
        Image:
          desc: 저장할 이미지 개체.
        UseClipboard:
          desc: 클립보드에 있는 이미지를 사용할지 여부.
        Directory:
          desc: 이미지를 저장할 디렉터리 경로.
    InvokeCode:
      desc: 워크플로 안에서 직접 작성한 VB 코드를 실행합니다. 인자를 주고받을 수 있습니다.
      props:
        VBCode:
          desc: 실행할 VB 코드.
        Arguments:
          show: true
    InvokeWorkflowFile:
      desc: 다른 워크플로(.xaml) 파일을 호출해 실행하며, 인자를 주고받습니다.
      props:
        WorkflowFilePath:
          desc: 호출할 워크플로(.xaml) 파일 경로.
        Arguments:
          show: true
    MessageBox:
      desc: 메시지 상자를 띄워 사용자에게 안내 문구를 보여 줍니다.
      props:
        Value:
          desc: 메시지 상자에 표시할 값.
    MessageBoxDataTable:
      desc: DataTable의 내용을 표 형태로 메시지 상자에 표시합니다.
      props:
        Value:
          desc: 메시지 상자에 표시할 DataTable.
    InvokePowerShell:
      desc: PowerShell 명령이나 스크립트를 실행하고 결과를 가져옵니다.
      props:
        CommandText:
          desc: 실행할 PowerShell 명령 또는 스크립트 텍스트.
        Input:
          desc: PowerShell 파이프라인에 전달할 입력 개체 모음.
        Parameter:
          desc: PowerShell에 전달할 매개변수(이름-값).
        PowerShellVariables:
          desc: 스크립트에서 사용할 PowerShell 변수(이름-값).
        IsScript:
          desc: 명령을 단일 명령이 아닌 스크립트로 실행할지 여부.
        TypeArgument:
          desc: 값의 데이터 형식(Type).
    StartPython:
      desc: 지정한 Python 스크립트 파일을 인자와 함께 실행합니다.
      props:
        argument:
          desc: 실행할 프로그램/스크립트에 전달할 명령줄 인수.
    PathExist:
      desc: 지정한 파일/폴더 경로가 존재하는지 확인해 참/거짓을 반환합니다.
      props:
        Path:
          desc: 존재 여부를 확인할 대상 경로.
        PathType:
          desc: 확인할 경로의 종류(파일/폴더).
        Exists:
          desc: 지정한 경로의 존재 여부(출력).
    CopyFile:
      desc: 파일을 지정한 위치로 복사합니다.
      props:
        overwrite:
          desc: 대상이 이미 있으면 덮어쓸지 여부.
        destination:
          desc: 복사/이동할 대상 경로.
    MoveFile:
      desc: 파일을 지정한 위치로 이동합니다.
      props:
        Overwrite:
          desc: 대상이 이미 있으면 덮어쓸지 여부.
        destination:
          desc: 복사/이동할 대상 경로.
    DeleteFile:
      desc: 지정한 파일을 삭제합니다.
    ReadTextFile:
      desc: 텍스트 파일을 읽어 문자열로 돌려줍니다. 인코딩을 비우면 UTF-8(BOM 자동 인식)로 읽습니다.
      props:
        filePath:
          desc: 읽을 텍스트 파일 경로. 상대 경로는 프로젝트 폴더 기준입니다.
        Encoding:
          desc: '파일 인코딩 이름(예: utf-8, euc-kr). 비우면 UTF-8.'
        Result:
          desc: 읽은 텍스트 전체(출력).
    WriteTextFile:
      desc: 텍스트를 파일에 씁니다. 파일이 있으면 통째로 덮어쓰고, 없는 폴더는 만듭니다. 임시 파일에 다 쓴 뒤 바꿔 넣으므로 쓰는 도중 실패해도 반쪽짜리 파일이 남지 않습니다. UiPath Write Text File 에 해당합니다.
      props:
        filePath:
          desc: 쓸 파일 경로. 상대 경로는 프로젝트 폴더 기준입니다. […] 버튼으로 저장 대화상자를 열 수 있습니다.
        Text:
          desc: 파일에 쓸 텍스트.
        Encoding:
          desc: '인코딩 이름. 비우거나 utf-8 이면 BOM 없는 UTF-8, BOM 이 필요하면 utf-8-bom, 그 밖에 euc-kr 등 .NET 인코딩 이름.'
    AppendLine:
      desc: 파일 끝에 텍스트 한 줄(끝에 줄 바꿈)을 덧붙입니다. 파일이 없으면 만듭니다. 실행 로그·결과 기록을 쌓을 때 씁니다. UiPath Append Line 에 해당합니다.
      props:
        filePath:
          desc: 덧붙일 파일 경로. 상대 경로는 프로젝트 폴더 기준입니다.
        Text:
          desc: 덧붙일 한 줄 텍스트(줄 바꿈은 자동으로 붙습니다).
        Encoding:
          desc: '인코딩 이름. 비우거나 utf-8 이면 BOM 없는 UTF-8, BOM 이 필요하면 utf-8-bom.'
    CreateFile:
      desc: 빈 파일을 만듭니다. 이미 있으면 덮어쓰기 옵션이 켜졌을 때만 비우고, 꺼져 있으면 그대로 둡니다. UiPath Create File 에 해당합니다(폴더+이름 대신 전체 경로 하나).
      props:
        filePath:
          desc: 만들 파일 경로. 없는 폴더는 함께 만듭니다.
        Overwrite:
          desc: 이미 있는 파일을 비울지 여부(기본 false = 있는 파일 그대로).
    StartProcess:
      desc: 지정한 프로그램(실행 파일)을 인자와 함께 실행합니다.
      props:
        argument:
          desc: 실행할 프로그램/스크립트에 전달할 명령줄 인수.
    MaximizeWindow:
      desc: 대상 창을 최대화합니다.
      props:
        Window:
          desc: 동작 대상이 되는 창(프로세스).
    InputDialog:
      desc: 입력 대화 상자를 띄워 사용자로부터 값을 입력받습니다.
      props:
        DialogTitle:
          desc: 입력 대화 상자의 제목.
        InputLabel:
          desc: 입력 대화 상자에 표시할 안내 라벨.
        InputType:
          desc: 입력 대화 상자에서 받을 값의 형식(텍스트/숫자/선택 등).
        Options:
          desc: 입력 대화 상자에서 선택할 수 있는 항목 목록.
    GetToClipBoard:
      desc: 클립보드에 들어 있는 텍스트를 가져옵니다.
      props:
        text:
          desc: 클립보드로 주고받을 텍스트.
    SetToClipBoard:
      desc: 지정한 텍스트를 클립보드에 복사합니다.
      props:
        text:
          desc: 클립보드로 주고받을 텍스트.
    CreateDirectory:
      desc: 지정한 경로에 폴더를 생성합니다.
    DeleteDirectory:
      desc: 지정한 폴더를 삭제합니다.
    CommentOut:
      desc: 본문에 담긴 자식 액티비티를 실행하지 않고 건너뜁니다. 일부 단계를 임시로 비활성화(주석 처리)할 때 사용합니다.
      props:
        Note:
          desc: 액티비티에 남기는 메모(주석)로, 실행에는 영향을 주지 않는다.
    ClickV2:
      desc: 셀렉터로 지정한 요소를 클릭하는 개선판 클릭 액티비티입니다. 요소 탐색 범위를 제한해 응답이 느린 창에서도 빠르게 대상을 찾고, 셀렉터 속성이 정확히 일치하지 않아도 **유사 일치**로 요소를 찾을 수 있습니다. 속성 구성은 `클릭`과 같고 유사 일치 옵션 세 가지가 추가되었습니다.
      props:
        EnableFuzzyMatching:
          desc: 셀렉터와 정확히 일치하는 요소가 없을 때 유사 일치로 대상을 찾을지 여부(기본 true).
        FuzzyThreshold:
          desc: 유사 일치로 인정할 최소 유사도(0~100, 기본 82). 값이 낮을수록 느슨하게 찾습니다.
        RequireUniqueTarget:
          desc: 유사 일치 후보가 여럿일 때 가장 높은 점수의 요소가 확실히 구분되는 경우에만 클릭할지 여부(기본 true). 구분되지 않으면 실패로 처리합니다.
    DeleteFileOrDirectory:
      desc: 지정한 경로가 파일이면 파일을, 폴더면 하위 내용까지 포함해 삭제합니다. 경로가 존재하지 않으면 오류가 발생합니다. 파일과 폴더를 구분하지 않고 지울 때 `파일 삭제`·`디렉토리 삭제` 대신 사용합니다.
      props:
        path:
          desc: 삭제할 파일 또는 폴더 경로. 상대 경로는 프로젝트 루트 기준으로 해석됩니다.
- key: statements
  name: Statements
  title: Statements (흐름 제어)
  summary: 흐름 제어(조건·반복·예외·시퀀스)
  intro: 조건·반복·예외·시퀀스 등 워크플로 제어 구조. 대부분 WF 표준 액티비티입니다.
  namespace_hint:
  - MeetupWfIntro.MeetupActivityLibrary.Activities.Meetup.Statements
  - DX.TEST.Activities
  - SwitchActivityLibrary.Activities
  activities:
    Assign:
      desc: 변수에 값을 대입합니다.
    If:
      desc: 조건에 따라 분기합니다.
    Sequence:
      desc: 자식 액티비티를 순서대로 실행합니다.
    Parallel:
      desc: 여러 자식 액티비티를 병렬로 실행합니다.
    TryCatch:
      desc: 본문 실행 중 발생한 예외를 잡아 처리하고, 필요하면 마무리 작업을 수행합니다.
    Throw:
      desc: 지정한 예외를 발생시킵니다.
    Rethrow:
      desc: Catch 블록에서 잡은 예외를 다시 던집니다.
    WriteLine:
      desc: 지정한 텍스트를 출력합니다.
    Delay:
      desc: 지정한 시간만큼 실행을 대기합니다.
      props:
        Duration:
          desc: 대기할 시간(TimeSpan 형식).
    Switch:
      desc: 식의 값에 따라 여러 갈래 중 하나로 분기합니다.
      props:
        SwitchExpression:
          desc: 분기를 결정하는 판단 식으로, 각 케이스 값과 비교된다.
    ForEach_WF:
      standard: true
      display: ForEach<T> (WF 표준)
      desc: Windows Workflow Foundation 표준 For Each 액티비티입니다. NeoRPA 전용 반복 액티비티(`반복 실행`, `For Each <T>`)는 반복 인덱스 출력 등 확장 기능을 제공하므로 새 워크플로에서는 전용 액티비티 사용을 권장합니다.
    ForEach:
      desc: 컬렉션의 각 요소에 대해 본문을 반복 실행합니다.
      props:
        Collection:
          desc: 반복 처리할 대상 컬렉션.
        Index:
          desc: 현재 반복 항목의 인덱스(출력, 0부터 시작).
    ForEach_T:
      desc: 형식 인수 T를 지정해 컬렉션의 각 항목을 T 형식의 반복 변수(기본 이름 `item`)로 받아 본문을 반복 실행합니다. 항목 형식을 미리 알고 있을 때 `반복 실행` 대신 사용하면 본문에서 형 변환 없이 바로 쓸 수 있습니다.
      props:
        Collection:
          desc: 반복 처리할 대상 컬렉션. 각 항목은 실행 시 T 형식으로 변환됩니다.
    RetryScope:
      desc: 본문이 성공하거나 지정한 횟수에 도달할 때까지 재시도합니다.
      props:
        NumberOfRetries:
          desc: 실패 시 시도할 최대 재시도 횟수.
        RetryInterval:
          desc: 재시도 사이에 대기할 간격(TimeSpan 형식).
        AttemptCount:
          show: true
          desc: 실제로 수행된 재시도 횟수(출력).
        Succeeded:
          show: true
          desc: 재시도 끝에 성공했는지 여부(출력).
        LastFailureType:
          show: true
          desc: 마지막 실패의 예외 형식 이름(출력).
        LastExceptionMessage:
          show: true
          desc: 마지막 시도에서 발생한 예외 메시지(출력).
    While:
      desc: 조건이 참인 동안 본문을 반복 실행합니다(선검사).
      props:
        Condition:
          desc: 반복을 계속할지 판단하는 조건식(결과가 참인 동안 반복).
        IterationCount:
          desc: 반복이 수행된 총 횟수(출력).
    DoWhile:
      desc: 본문을 먼저 실행한 뒤 조건이 참인 동안 반복합니다(후검사).
      props:
        Condition:
          desc: 반복을 계속할지 판단하는 조건식(결과가 참인 동안 반복).
        IterationCount:
          desc: 반복이 수행된 총 횟수(출력).
    Break:
      desc: 반복문을 즉시 빠져나옵니다.
    Continue:
      desc: 반복문의 나머지를 건너뛰고 다음 반복으로 넘어갑니다.
    AddToCollection:
      desc: 컬렉션에 항목을 추가합니다.
- key: excel-workbook
  name: Excel WorkBook
  title: Excel WorkBook
  summary: COM 워크북 직접 조작
  intro: Excel 워크북을 COM으로 직접 조작합니다(스코프 없이 파일 단위).
  namespace_hint:
  - MeetupWfIntro.MeetupActivityLibrary.Activities.Meetup
  - DX.TEST.Activities
  activities:
    ExcelInvokeVBA:
      desc: 워크북을 직접 열어 외부 VBA 파일을 불러온 뒤 지정한 함수를 실행합니다.
      props:
        ExcelFilePath:
          desc: 대상 엑셀 파일의 경로.
        VBAfilePath:
          desc: 가져올 VBA 매크로 파일의 경로.
        FunctionName:
          desc: 실행할 VBA 함수/매크로 이름.
        Parameters:
          desc: VBA 함수에 전달할 인수 배열.
    ExcelWrite:
      desc: 워크북 파일을 직접 열어 지정한 셀/범위에 값을 씁니다.
    ExcelFilter:
      desc: 워크북을 직접 열어 지정한 범위에 필터를 적용합니다.
      props:
        filterOption:
          desc: 적용할 필터 조건 목록.
    CopyRange:
      desc: 워크북에서 지정한 범위를 다른 위치로 복사합니다.
      props:
        CopyValue:
          desc: 셀 값을 복사할지 여부.
        CopyNumberFormat:
          desc: 숫자 표시 형식을 함께 복사할지 여부.
        CopyCellFormat:
          desc: 셀 서식을 함께 복사할지 여부.
        CopyFormula:
          desc: 수식을 함께 복사할지 여부.
        CopyAll:
          desc: 원본 범위의 모든 항목(값·서식·수식)을 복사할지 여부.
        DestinationCell:
          desc: '붙여넣을 대상 셀 위치(예: A1).'
    DeleteRange:
      desc: 워크북에서 지정한 범위를 삭제합니다.
      props:
        shiftCells:
          desc: 셀을 삭제한 뒤 남은 셀을 이동시킬지 여부.
        shiftUp:
          desc: 셀을 삭제한 뒤 남은 셀을 위로 이동시킬지 여부.
        shiftLeft:
          desc: 셀을 삭제한 뒤 남은 셀을 왼쪽으로 이동시킬지 여부.
        EntireRow:
          desc: 행 전체를 대상으로 삭제할지 여부.
        EntireColumn:
          desc: 열 전체를 대상으로 삭제할지 여부.
    SetRangeColor:
      desc: 워크북에서 지정한 범위의 배경 색상을 설정합니다.
    SelectRange:
      desc: 워크북에서 지정한 범위를 선택합니다.
    ReadRange:
      desc: 워크북 파일을 직접 열어 지정한 범위를 읽어 DataTable로 반환합니다.
      props:
        PreserveFormat:
          desc: 셀의 표시 서식을 유지한 채 값을 읽을지 여부.
        useFilter:
          desc: 읽을 때 적용된 필터를 반영할지 여부.
    AppendRange:
      desc: 워크북 시트의 기존 데이터 끝에 DataTable 내용을 이어서 추가합니다.
    GetSelectedRange:
      desc: 워크북에서 현재 선택된 범위의 주소를 가져옵니다.
    GetCellColor:
      desc: 워크북에서 지정한 셀의 배경 색상을 가져옵니다.
    ReadCellFormula:
      desc: 워크북에서 지정한 셀에 들어 있는 수식을 읽어 반환합니다.
    ReadCell:
      desc: 워크북에서 지정한 셀의 값을 읽어 반환합니다.
    CopySheet:
      desc: 워크북 안에서 시트를 복사합니다.
    InsertDeleteCol:
      desc: 워크북 시트에 열을 삽입하거나 삭제합니다.
    ReadColumn:
      desc: 워크북에서 지정한 열 전체를 읽어 반환합니다.
      props:
        startCell:
          desc: '읽기를 시작할 셀 주소(예: A2). 이 셀부터 아래로 값을 읽습니다.'
    CloseWorkbook:
      desc: 열려 있는 워크북을 닫습니다.
    GetWorkbookSheet:
      desc: 워크북에서 지정한 인덱스(번호)의 시트 이름을 가져옵니다.
      props:
        index:
          desc: 대상 시트의 인덱스(번호).
        sheet:
          desc: 조회된 시트 이름(출력).
    GetWorkbookSheets:
      desc: 워크북에 있는 모든 시트 이름 목록을 가져옵니다.
      props:
        sheets:
          desc: 워크북에 있는 시트 이름 목록(출력).
    AutoFillRange:
      desc: 원본 범위를 기준으로 대상 범위를 자동 채우기(수식·연속 값)합니다.
      props:
        FillRange:
          desc: '자동 채우기를 확장할 대상 범위(예: A1:A10).'
    Save:
      desc: 열려 있는 워크북을 파일로 저장합니다.
      props:
        saveName:
          show: true
          desc: 저장할 파일 이름 또는 경로.
    Sort:
      desc: 워크북의 범위를 지정한 기준으로 정렬합니다.
      props:
        order:
          desc: 정렬 순서(오름차순/내림차순).
    LookUp:
      desc: 워크북의 지정한 범위에서 특정 값을 찾아 그 위치(셀 주소)를 반환합니다.
    RemoveDuplicatesRange:
      desc: 워크북 범위에서 중복된 행을 제거합니다.
    GetTableRange:
      desc: 워크북에서 지정한 표(테이블)가 차지하는 범위 주소를 가져옵니다.
    CreatePivotTable:
      desc: 워크북에 피벗 테이블을 생성합니다.
      props:
        sourceTableName:
          desc: 피벗의 원본이 되는 테이블 이름.
    InsertDeleteRow:
      desc: 워크북 시트에 행을 삽입하거나 삭제합니다.
    ReadRow:
      desc: 워크북에서 지정한 행 전체를 읽어 반환합니다.
- key: excel-scope
  name: Excel Scope
  title: Excel Scope
  summary: 스코프 기반 Excel
  intro: Excel Scope 안에서 워크북/시트를 열어 두고 자식 액티비티가 그 컨텍스트를 공유합니다. 여러 작업을 한 세션으로 묶을 때 사용.
  namespace_hint:
  - ExcelScopeLibrary.Activities.ExcelScope
  activities:
    ExcelInvokeVBA:
      desc: Excel Scope 안에서 외부 VBA 파일을 불러와 지정한 함수를 실행합니다.
      props:
        VBAfilePath:
          desc: 가져올 VBA 매크로 파일의 경로.
        FunctionName:
          desc: 실행할 VBA 함수/매크로 이름.
        Parameters:
          desc: VBA 함수에 전달할 인수 배열.
        RestoreExcelUiState:
          desc: VBA 실행 전 Excel 애플리케이션의 UI 상태(화면 갱신·경고 표시·이벤트·계산 모드·표시 여부 등)를 기억해 두고 실행 후 되돌릴지 여부(기본 true).
        AccessibilityRecoveryTimeoutMs:
          desc: VBA 실행 후 Excel이 다시 응답(Ready) 상태가 될 때까지 기다릴 최대 시간(밀리초, 기본 5000).
        RestartOwnedExcelOnAccessibilityFailure:
          desc: 대기 시간 안에 Excel이 응답하지 않으면, 이 스코프가 직접 연 Excel인 경우 Excel을 다시 시작해 복구할지 여부(기본 true).
    ExcelScope:
      desc: 워크북/시트를 열어 두고 본문의 자식 액티비티가 그 Excel 세션을 공유하도록 하는 컨테이너입니다.
      props:
        filepath:
          desc: 대상 파일의 경로.
        InputWorkbook:
          desc: 작업 대상으로 사용할, 이미 열려 있는 워크북 개체.
        CreateFile:
          desc: 대상 파일이 없으면 새로 만들지 여부.
        Visible:
          desc: 엑셀 애플리케이션 창을 화면에 표시할지 여부.
        Save:
          desc: 스코프를 마칠 때 워크북을 저장할지 여부.
        ReadOnly:
          desc: 워크북을 읽기 전용으로 열지 여부.
        OpenMode:
          desc: 워크북을 여는 방식(읽기/쓰기 등).
        Macro:
          desc: 매크로가 포함된 워크북으로 처리할지 여부.
        InstanceCachePeriod:
          show: true
          desc: 엑셀 인스턴스를 캐시로 유지할 시간(밀리초).
        Workbook:
          desc: 대상 워크북 개체(입력/출력).
        EditPassword:
          desc: 엑셀 파일의 편집(쓰기) 암호.
        WorkbookPath:
          show: true
          desc: 열 워크북 파일의 경로.
        Password:
          desc: 접근에 사용할 암호(파일 또는 메일 계정).
    ExcelWrite:
      desc: Excel Scope 안에서 지정한 셀/범위에 값을 씁니다.
    ExcelOpen:
      desc: Excel Scope 안에서 워크북 파일을 엽니다.
    ExcelFilter:
      desc: Excel Scope 안에서 지정한 범위에 필터를 적용합니다.
      props:
        filterOption:
          desc: 적용할 필터 조건 목록.
    ExecuteMacro:
      desc: Excel Scope 안에서 워크북에 저장된 매크로를 이름으로 실행합니다.
      props:
        macroName:
          desc: 실행할 매크로 이름.
        macroParameters:
          desc: 매크로에 전달할 인수.
        macroOutput:
          desc: 매크로 실행 결과(출력).
    CopyRange:
      desc: Excel Scope 안에서 지정한 범위를 다른 위치로 복사합니다.
      props:
        CopyValue:
          desc: 셀 값을 복사할지 여부.
        CopyNumberFormat:
          desc: 숫자 표시 형식을 함께 복사할지 여부.
        CopyCellFormat:
          desc: 셀 서식을 함께 복사할지 여부.
        CopyFormula:
          desc: 수식을 함께 복사할지 여부.
        CopyAll:
          desc: 원본 범위의 모든 항목(값·서식·수식)을 복사할지 여부.
        DestinationCell:
          desc: '붙여넣을 대상 셀 위치(예: A1).'
    DeleteRange:
      desc: Excel Scope 안에서 지정한 범위를 삭제합니다.
      props:
        shiftCells:
          desc: 셀을 삭제한 뒤 남은 셀을 이동시킬지 여부.
        ShiftOption:
          desc: 셀을 삭제한 뒤 남은 셀을 이동시키는 방식.
    SetRangeColor:
      desc: Excel Scope 안에서 지정한 범위의 배경 색상을 설정합니다.
    SelectRange:
      desc: Excel Scope 안에서 지정한 범위를 선택합니다.
    WriteRange:
      desc: Excel Scope 안에서 DataTable 내용을 지정한 위치부터 범위에 씁니다.
      props:
        StartingCell:
          desc: '작업을 시작할 기준 셀 위치(예: A1).'
    ReadRange:
      desc: Excel Scope 안에서 지정한 범위를 읽어 DataTable로 반환합니다.
      props:
        PreserveFormat:
          desc: 셀의 표시 서식을 유지한 채 값을 읽을지 여부.
        useFilter:
          desc: 읽을 때 적용된 필터를 반영할지 여부.
    AppendRange:
      desc: Excel Scope 안에서 기존 데이터 끝에 DataTable 내용을 이어서 추가합니다.
    GetSelectedRange:
      desc: Excel Scope 안에서 현재 선택된 범위의 주소를 가져옵니다.
    GetCellColor:
      desc: Excel Scope 안에서 지정한 셀의 배경 색상을 가져옵니다.
    ReadCell:
      desc: Excel Scope 안에서 지정한 셀의 값을 읽어 반환합니다.
    CopySheet:
      desc: Excel Scope 안에서 시트를 복사합니다.
      props:
        DestinationFilePath:
          desc: 복사 대상 파일의 경로.
    InsertDeleteCol:
      desc: Excel Scope 안에서 열을 삽입하거나 삭제합니다.
    CloseWorkbook:
      desc: Excel Scope 안에서 워크북을 닫습니다.
      props:
        Workbook:
          desc: 대상 워크북 개체(입력/출력).
        SaveChanges:
          desc: 워크북을 닫을 때 변경 내용을 저장할지 여부.
        QuitApplicationIfOwned:
          desc: 이 워크북이 직접 연 엑셀이라면 닫을 때 애플리케이션도 함께 종료할지 여부.
    GetWorkbookSheet:
      desc: Excel Scope 안에서 지정한 이름의 시트를 가져옵니다.
      props:
        index:
          desc: 대상 시트의 인덱스(번호).
        sheet:
          desc: 조회된 시트 이름(출력).
    GetWorkbookSheets:
      desc: Excel Scope 안에서 모든 시트 이름 목록을 가져옵니다.
      props:
        sheets:
          desc: 워크북에 있는 시트 이름 목록(출력).
    AutoFillRange:
      desc: Excel Scope 안에서 원본 범위를 기준으로 대상 범위를 자동 채우기합니다.
      props:
        FillRange:
          desc: '자동 채우기를 확장할 대상 범위(예: A1:A10).'
    Save:
      desc: Excel Scope 안에서 워크북을 저장합니다.
      props:
        saveName:
          show: true
          desc: 저장할 파일 이름 또는 경로.
    Sort:
      desc: Excel Scope 안에서 범위를 지정한 기준으로 정렬합니다.
      props:
        order:
          desc: 정렬 순서(오름차순/내림차순).
    LookUp:
      desc: Excel Scope 안에서 지정한 범위에서 특정 값을 찾아 그 위치(셀 주소)를 반환합니다.
      props:
        MatchMode:
          desc: 값을 조회할 때 일치시키는 방식(정확히 일치, 부분 일치 등).
    RemoveDuplicatesRange:
      desc: Excel Scope 안에서 범위의 중복된 행을 제거합니다.
    DeleteColumn:
      desc: Excel Scope 안에서 지정한 열을 삭제합니다.
    InsertColumn:
      desc: Excel Scope 안에서 지정한 위치에 열을 삽입합니다.
    GetTableRange:
      desc: Excel Scope 안에서 지정한 표(테이블)가 차지하는 범위 주소를 가져옵니다.
      props:
        IsPivot:
          desc: 대상 테이블이 피벗 테이블인지 여부.
    CreateTable:
      desc: Excel Scope 안에서 지정한 범위를 표(테이블)로 만듭니다.
    CreatePivotTable:
      desc: Excel Scope 안에서 피벗 테이블을 생성합니다.
      props:
        sourceTableName:
          desc: 피벗의 원본이 되는 테이블 이름.
    InsertDeleteRow:
      desc: Excel Scope 안에서 행을 삽입하거나 삭제합니다.
    ReadRow:
      desc: Excel Scope 안에서 지정한 행 전체를 읽어 반환합니다.
      props:
        StartingCell:
          desc: '작업을 시작할 기준 셀 위치(예: A1).'
- key: datatable
  name: DataTable
  title: DataTable
  summary: 데이터테이블 조작
  intro: System.Data.DataTable을 만들고 병합·조인·필터·정렬·행·열을 조작합니다.
  namespace_hint:
  - DataTableLibrary.Activities
  - DX.TEST.Activities
  activities:
    BuildDataTable:
      desc: 빈 DataTable을 컬럼 정의와 함께 만듭니다.
      props:
        tableXml:
          show: true
          desc: 테이블의 구조와 데이터를 정의한 XML.
    MergeDataTable:
      desc: 두 DataTable을 하나로 병합합니다.
      props:
        TargetTable:
          desc: 병합 결과를 받을 대상 DataTable.
        SourceTable:
          desc: 병합할 원본 DataTable.
    AddColumnDataTable:
      desc: DataTable에 새 열을 추가합니다.
      props:
        AllowDBNull:
          desc: 이 열에 DBNull(빈 값)을 허용할지 여부.
        AutoIncrement:
          desc: 이 열의 값을 자동으로 1씩 증가시킬지 여부.
        DefaultValue:
          desc: 새 열에 채울 기본값.
        MaxLength:
          desc: 이 문자열 열이 가질 수 있는 최대 길이.
        Unique:
          desc: 이 열의 값이 중복 없이 고유해야 하는지 여부.
        TypeArgument:
          desc: 값의 데이터 형식(Type).
    SortDataTable:
      desc: DataTable을 지정한 열 기준으로 정렬합니다.
      props:
        Order:
          desc: 정렬 순서(오름차순/내림차순).
        DataTable2:
          desc: 조인/정렬할 두 번째 DataTable.
    ClearDataTable:
      desc: DataTable의 모든 행을 삭제해 초기화합니다.
    OutputDataTable:
      desc: DataTable의 내용을 읽기 좋은 문자열(텍스트 표)로 변환합니다.
      props:
        Text:
          desc: DataTable을 문자열로 변환한 결과(출력).
    ForEachRowTable:
      desc: DataTable의 각 행에 대해 본문을 반복 실행합니다.
      props:
        Index:
          desc: 현재 반복 항목의 인덱스(출력, 0부터 시작).
    AddRowDataTable:
      desc: DataTable에 새 행을 추가합니다.
      props:
        DataRow:
          desc: 추가할 DataRow 개체.
        ArrayRow:
          desc: 새 행으로 추가할 값들의 배열(열 순서대로).
    RemoveColumnDataTable:
      desc: DataTable에서 지정한 열을 삭제합니다.
    RemoveDuplicateRows:
      desc: DataTable에서 중복된 행을 제거합니다.
      props:
        OutDataTable:
          desc: 추출 결과를 담는 DataTable(출력).
    RemoveRowDataTable:
      desc: DataTable에서 지정한 행을 삭제합니다.
      props:
        Row:
          desc: 대상 DataRow 개체.
        RowIndex:
          desc: 대상 행의 인덱스(0부터 시작).
    GetRowItem:
      desc: DataTable 행에서 지정한 열의 값을 가져옵니다.
      props:
        Row:
          desc: 대상 DataRow 개체.
    DTToCSV:
      desc: DataTable을 CSV 파일로 저장합니다.
      props:
        filepath:
          desc: 대상 파일의 경로.
    JoinDataTable:
      desc: 두 DataTable을 지정한 키 기준으로 조인해 하나로 합칩니다.
      props:
        DataTable1:
          desc: 조인할 첫 번째 DataTable.
        DataTable2:
          desc: 조인/정렬할 두 번째 DataTable.
        JoinConfiguration:
          desc: 두 테이블을 조인하는 방식(조인 종류·키 매핑)을 정의하는 설정.
    FilterDataTable:
      desc: 조건에 맞는 행만 남기도록 DataTable을 필터링합니다.
      props:
        OutputDataTable:
          desc: 필터링 결과를 담는 DataTable(출력).
        FilterRowsMode:
          desc: 조건에 맞는 행을 남길지 제거할지 지정하는 모드.
        SelectColumnsMode:
          desc: 지정한 열을 남길지 제거할지 지정하는 모드.
        Filters:
          desc: 적용할 행 필터 조건 목록.
        SelectColumns:
          desc: 결과에 포함할 열 목록.
- key: mail
  name: Mail
  title: Mail
  summary: 메일 송수신(SMTP/POP3)
  intro: SMTP로 메일을 보내고 POP3로 받습니다.
  namespace_hint:
  - DX.TEST.Activities
  activities:
    SendMail:
      desc: SMTP로 메일을 전송합니다(첨부 지원).
      props:
        logonPassword:
          desc: 메일 발송에 사용할 로그인 암호.
        logonEmail:
          desc: 메일 발송에 사용할 로그인 계정.
        senderEmail:
          desc: 보내는 사람의 메일 주소.
        senderName:
          desc: 보내는 사람의 표시 이름.
        receiverEmail:
          desc: 메일 수신자 주소.
        ccEmails:
          desc: 메일 참조(CC) 수신자 주소.
        bccEmails:
          desc: 메일 숨은 참조(BCC) 수신자 주소.
        isBodyHtml:
          desc: 본문을 HTML 형식으로 보낼지 여부.
        continueOnError:
          show: true
          desc: 오류가 발생해도 워크플로를 멈추지 않고 계속 진행할지 여부(true/false).
        subject:
          desc: 메일 제목.
        body:
          desc: 메일 본문 내용.
        staticAttachments:
          desc: 미리 지정한 고정 첨부 파일 경로 목록.
        dynamicAttachments:
          desc: 실행 중 값으로 지정하는 첨부 파일 경로 목록.
        server:
          desc: 메일 서버 주소.
        port:
          desc: 메일 서버 포트 번호.
    POP3Mail:
      desc: POP3 서버에 접속해 메일을 수신하고 메시지 목록으로 가져옵니다.
      props:
        TimeoutMS:
          desc: 서버 연결을 기다릴 최대 시간(밀리초).
        Email:
          desc: 메일 로그인 계정(메일 주소).
        Password:
          desc: 접근에 사용할 암호(파일 또는 메일 계정).
        DeleteMessages:
          desc: 가져온 뒤 서버에서 메일을 삭제할지 여부.
        SecureConnection:
          desc: 메일 서버 보안 연결 방식(SSL/TLS 등).
        Top:
          desc: 가져올 최대 메일 개수.
        Messages:
          desc: 가져온 메일 메시지 목록(출력).
        Port:
          desc: 메일 서버 포트 번호.
        Server:
          desc: 메일 서버 주소.
- key: web
  name: Web
  title: Web (HTTP 요청 · JSON)
  summary: REST API 호출과 JSON 읽기·만들기
  intro: HTTP(S) 요청을 보내고 응답을 받으며, JSON 문자열을 읽거나 만듭니다. UiPath 의 HTTP Request·Deserialize JSON 에 해당합니다. 인증 비밀은 `보안 › 자격 증명 가져오기(GetCredential)` 의 보호된 비밀번호를 연결하면 워크플로 파일에 남지 않습니다.
  namespace_hint:
  - MeetupWfIntro.MeetupActivityLibrary.Activities.Meetup
  activities:
    HttpRequest:
      desc: 'HTTP(S) 요청을 보내고 상태 코드·응답 본문·응답 헤더를 돌려줍니다. 헤더는 한 줄에 하나씩 `이름: 값` 으로 적고, 본문이 있는데 콘텐츠 형식을 비우면 `application/json` 으로 보냅니다. 상태 코드 400 이상은 기본적으로 오류가 아니라 상태 코드로 돌려주며(UiPath 와 같음), 오류로 받고 싶으면 `오류 상태면 실패` 를 켭니다.'
      props:
        Url:
          desc: 요청 주소(http:// 또는 https:// 로 시작하는 절대 주소). 쿼리 문자열은 주소에 직접 적습니다.
        Method:
          desc: HTTP 메서드(GET·POST·PUT·PATCH·DELETE·HEAD·OPTIONS). 카드의 콤보에서 고릅니다.
        Headers:
          desc: '요청 헤더. 한 줄에 하나씩 `이름: 값`(예: `Accept: application/json`). Content-Type 을 적으면 본문 형식으로 씁니다.'
        Body:
          desc: 요청 본문(JSON 등). GET·HEAD 에는 보낼 수 없습니다.
        ContentType:
          desc: 본문의 Content-Type. 비우면 application/json(헤더에 적은 Content-Type 이 있으면 그것). 문자 집합은 UTF-8.
        TimeoutMS:
          desc: 응답을 기다릴 최대 시간(밀리초). 0 또는 비우면 30000.
        AuthType:
          desc: 인증 방식. None(없음) · Basic(사용자 이름+비밀번호) · Bearer(토큰) · ApiKey(헤더에 키).
        Username:
          desc: Basic 인증의 사용자 이름.
        Password:
          desc: Basic 비밀번호·Bearer 토큰·API 키(평문). 직접 적으면 워크플로 파일에 남아 설계 시점에 경고가 납니다. 보호된 비밀번호가 있으면 그쪽이 우선합니다.
        SecurePassword:
          desc: 보호된 비밀(SecureString). `자격 증명 가져오기(GetCredential)` 의 SecurePassword 출력을 연결합니다.
        ApiKeyHeader:
          desc: ApiKey 인증에서 키를 실을 헤더 이름. 비우면 X-API-Key.
        SaveToFile:
          desc: 비우지 않으면 응답 본문을 이 파일에 저장합니다(파일 다운로드). 이때 `결과` 에는 저장한 파일 경로가 들어갑니다.
        FailOnErrorStatus:
          desc: true 면 상태 코드 400 이상을 오류로 던집니다. 기본 false.
        Result:
          desc: 응답 본문 문자열(출력). 파일로 저장했으면 저장한 경로.
        StatusCode:
          desc: HTTP 상태 코드(출력, 예 200·404).
        ResponseHeaders:
          desc: 응답 헤더 사전(출력, Dictionary(Of String, String)).
    DeserializeJson:
      desc: JSON 문자열을 JObject 로 풉니다. 결과는 식에서 `obj("name").ToString()`, `obj("items")(0)("id")` 처럼 읽습니다. 최상위가 배열이면 `JSON 배열 읽기` 를 쓰세요. UiPath Deserialize JSON 에 해당합니다.
      props:
        JsonString:
          desc: 풀 JSON 문자열(보통 HTTP 요청의 결과 변수).
        Result:
          desc: JObject(출력). 변수 타입은 Newtonsoft.Json.Linq.JObject.
    DeserializeJsonArray:
      desc: JSON 배열 문자열을 JArray 로 풀고, 같은 내용을 데이터 테이블로도 돌려줍니다(열 = 모든 개체의 키, 중첩 값은 JSON 문자열). UiPath Deserialize JSON Array 에 해당합니다.
      props:
        JsonString:
          desc: 풀 JSON 배열 문자열.
        Result:
          desc: JArray(출력). 변수 타입은 Newtonsoft.Json.Linq.JArray.
        DataTable:
          desc: 배열을 표로 만든 데이터 테이블(출력). 개체가 아닌 원소는 Value 열에 들어갑니다.
    GetJsonValue:
      desc: JSON 문자열에서 경로(JSONPath)의 값 하나를 문자열로 꺼냅니다. 변수 타입을 JObject 로 두지 않고 값 하나만 필요할 때 씁니다. 값이 없으면 빈 문자열(`없으면 실패` 를 켜면 오류).
      props:
        JsonString:
          desc: 값을 꺼낼 JSON 문자열.
        JsonPath:
          desc: '경로. 예: `data.items[0].name`, `$.total`, `[1]`. 앞의 `$.` 는 생략할 수 있습니다.'
        FailIfMissing:
          desc: 경로에 값이 없을 때 오류로 처리할지 여부(기본 false = 빈 문자열).
        Result:
          desc: 꺼낸 값(출력). 문자열은 따옴표 없이, 개체·배열은 한 줄 JSON 으로.
    SerializeJson:
      desc: 개체(데이터 테이블·Dictionary·List·JObject·일반 개체)를 JSON 문자열로 만듭니다. HTTP 요청 본문을 만들 때 씁니다.
      props:
        Input:
          desc: 'JSON 으로 만들 개체. 예: `New Dictionary(Of String, Object) From {{"name", 이름}, {"count", 3}}`, 데이터 테이블 변수.'
        Indented:
          desc: true 면 줄 바꿈·들여쓰기를 넣어 읽기 좋게 만듭니다(기본 false = 한 줄).
        Result:
          desc: JSON 문자열(출력).
- key: ai
  name: AI
  title: AI (AI 호출)
  summary: 이 PC 에 설치된 AI CLI(Claude Code · Codex · Gemini)에 일을 맡기고 결과를 변수로 받기
  intro: 이 PC 에 설치하고 로그인해 둔 AI 명령줄 도구(Claude Code · Codex(ChatGPT) · Gemini)를 불러 글·그림·문서를 처리하고, 결과를 워크플로 변수로 받습니다. 인증은 각 도구의 로그인을 그대로 쓰므로 API 키를 워크플로에 적지 않습니다.
  notes: |
    !!! note "제공 버전"
        AI 카테고리는 NeoRPA 2.2.4 다음 버전부터 제공됩니다. 툴박스에 **AI** 가 보이지 않으면 도움말 탭 → **버전 관리** 에서 새 버전을 확인하세요.

    !!! info "먼저 준비할 것"
        이 카테고리의 액티비티는 **워크플로를 실행하는 PC** 에 AI 명령줄 도구가 설치되어 있고 로그인되어 있어야 동작합니다. 쓰려는 도구 하나만 준비하면 됩니다.

        | 공급자 | 설치 (터미널) | 로그인 (터미널) |
        |---|---|---|
        | Claude Code (CLI) | `npm install -g @anthropic-ai/claude-code` | `claude` |
        | Codex (ChatGPT) CLI | `npm install -g @openai/codex` | `codex login` |
        | Gemini (CLI) | `npm install -g @google/gemini-cli` | `gemini` |

        설치·로그인 방법과 요금제는 각 도구의 공식 안내를 따릅니다. 준비가 끝났는지는 카드의 **연결** 아래 상태 줄에서 확인합니다(`AI 호출` 의 [연결 상태 줄](#ai-status) 참고).

        명령줄 도구에 로그인하기 어렵거나 도구를 설치하기 어려운 PC 에서는 **API 키**로 연결할 수 있습니다(`AI 호출` 의 [API 키로 연결하기](#ai-api) 참고).

    !!! warning "보내는 내용에 주의하세요"
        지침·프롬프트·첨부 파일의 내용은 선택한 AI 서비스로 전송됩니다. 개인정보나 사내 기밀이 든 파일을 보내도 되는지는 회사의 보안 정책과 해당 서비스의 약관을 먼저 확인하세요.
  namespace_hint:
  - MeetupWfIntro.MeetupActivityLibrary.Activities.Meetup
  activities:
    AiInvoke:
      desc: 'AI 에게 **지침**(늘 지킬 규칙·출력 모양)과 **프롬프트**(이번 실행의 요청)를 보내고 답을 변수로 받습니다. 그림·PDF·엑셀·워드·글 파일을 함께 붙일 수 있습니다. 결과는 **연결한 변수의 타입대로** 바꿔 담습니다 — 데이터 테이블 변수면 표로, 문자열 변수면 글로 들어오므로 뒤의 액티비티가 바로 쓸 수 있습니다.'
      props:
        Instruction:
          desc: '늘 같은 규칙과 출력 모양. 예: `"명함에서 회사명, 부서, 이름, 전화번호를 뽑아 표로 만들어 줘."` **카드에는 없고 속성 창에서 적습니다.** 값 칸 옆의 `…` 버튼을 누르면 따옴표 없이 글로 쓸 수 있는 편집 창이 열리고, 거기서 [지침 템플릿](#ai-templates) 을 고르거나 저장합니다. **지침 템플릿** 을 골랐으면 여기 적은 글은 템플릿 뒤에 덧붙는 추가 지침입니다. 지침(또는 지침 템플릿)과 프롬프트 중 하나는 있어야 합니다.'
        InstructionTemplate:
          desc: '쓸 [지침 템플릿](#ai-templates) 의 이름. 고르면 그 템플릿의 글이 지침으로 쓰입니다. 템플릿을 고치면 **그 템플릿을 쓰는 모든 액티비티**가 다음 실행부터 바뀐 지침으로 실행됩니다. 실행하는 PC 에 그 템플릿이 없으면 오류로 멈춥니다.'
        InstructionFiles:
          desc: '지침과 함께 보낼 참고 파일(양식 예시·규칙 문서 등)의 경로 목록. 예: `{"C:\자료\약칭표.txt"}`. 속성 창 값 칸 옆의 `…` 버튼으로 여는 창에서 [파일 추가…] 로 고릅니다.'
        Prompt:
          desc: 이번 실행의 요청. 비우면 지침대로 처리합니다. 변수를 섞어 실행마다 다른 요청을 보낼 때 씁니다.
        PromptFiles:
          desc: '처리할 대상 파일(그림·PDF·엑셀 등)의 경로 목록. 예: `{"C:\스캔\명함1.png", 파일경로변수}`. 카드의 프롬프트 옆 [첨부] 로 고릅니다.'
        Provider:
          desc: 'AI 를 부르는 방법. 이 PC 의 명령줄 도구인 Claude Code (CLI) · Codex (ChatGPT) CLI · Gemini (CLI), 또는 API 키로 직접 부르는 Claude API · OpenAI API · Gemini API 중에서 카드의 **연결** 콤보로 고릅니다. 기본은 Claude Code. 차이는 아래 [API 키로 연결하기](#ai-api) 를 보세요.'
        Model:
          desc: '모델 이름. 카드의 **모델** 드롭다운으로 고릅니다. 첫 항목(CLI 설정 / 기본값)은 비워 두는 것으로, CLI 연결은 그 도구에서 마지막에 고른 모델을, API 연결은 기본 모델을 씁니다. 목록에 없는 이름이나 변수는 여기 속성 창에 직접 적습니다(예: `"sonnet"`). 실제로 쓴 모델은 실행 로그에 남습니다.'
        ReasoningEffort:
          desc: '추론 강도. 카드의 **강도** 드롭다운으로 고릅니다(`low` · `medium` · `high` 등 그 연결이 받는 값). 비우면 CLI 설정(API 연결은 모델의 기본값)을 따릅니다. Gemini (CLI) 에는 이 옵션이 없습니다.'
        Permission:
          desc: 'AI 가 이 PC 에서 할 수 있는 일(CLI 연결). **읽기** · **읽기/쓰기** · **모든 권한** 중에서 고르며 **기본은 모든 권한**입니다. 모든 권한이면 AI 가 프롬프트대로 파일을 만들고 고치고 지우며 프로그램·명령도 실행합니다. 꼭 아래 [AI 권한](#ai-permission) 을 읽고 고르세요.'
        WorkingFolder:
          desc: 'AI 권한이 읽기/쓰기·모든 권한일 때 AI 가 일하는 폴더(만든 파일이 놓이는 곳). 비우면 프로젝트 폴더입니다. 상대 경로는 프로젝트 폴더 기준이고, 없는 폴더는 만듭니다.'
        ApiKey:
          desc: 'API 키(평문). 직접 적으면 워크플로 파일에 그대로 저장되어 경고가 표시됩니다. **API 키(보호)** 를 쓰세요.'
        SecureApiKey:
          desc: 'API 키(보호된 문자열). [자격 증명 가져오기](security.md) 로 Windows 자격 증명 관리자에서 읽은 값을 담은 변수를 연결합니다. API 연결에는 꼭 필요하고, **CLI 연결에서도 연결하면 로그인 없이 그 키로 실행합니다**([API 키로 연결하기](#ai-api)). 값이 있으면 **API 키** 보다 먼저 쓰입니다.'
        TimeoutSeconds:
          desc: 응답을 기다릴 최대 시간(초). 기본 180. 0 이거나 비우면 180 초입니다. 시간이 지나면 호출을 끝내고 오류로 처리합니다.
        RetryCount:
          desc: '호출이 실패했거나 답을 결과 변수의 타입으로 바꾸지 못했을 때 **처음부터 다시 부르는 횟수**. 기본 1, 0 이면 다시 부르지 않습니다(최대 10). 자세한 동작은 아래 [답이 맞지 않거나 호출이 실패하면](#ai-retry) 을 보세요.'
        OutputColumns:
          desc: '표(`DataTable`)로 받을 때의 **열 이름**을 쉼표로 구분해 적습니다(예: `"회사명, 담당자, 전화번호"`). 적으면 실행마다 그 이름, 그 순서의 열로 받습니다. 비워 두면 결과 변수에 이미 들어 있는 표의 열을 따릅니다. 자세한 동작은 아래 [표의 열을 정하기](#ai-columns) 를 보세요.'
        Result:
          desc: 'AI 의 답(출력). 타입이 정해져 있지 않아 **연결한 변수의 타입을 따릅니다**. 변환 규칙은 아래 [결과 타입](#ai-result-type) 표를 보세요.'
        RawResponse:
          desc: 변환하기 전의 응답 글 그대로(출력). AI 가 실제로 무엇을 답했는지 확인하거나, 결과와 별개로 원문을 로그·파일에 남길 때 씁니다.
      notes: |
        ### 쓰는 순서 { #ai-usage }

        1. 툴박스 **AI › AI 호출** 을 캔버스에 놓습니다.
        2. **연결** 콤보에서 쓸 도구를 고르고, 바로 아래 상태 줄에 초록 점과 "로그인됨" 이 보이는지 확인합니다. 필요하면 그 아래 **모델**·**강도** 드롭다운에서 고릅니다(그대로 두면 CLI 설정을 따릅니다).
        3. 카드를 선택하고 **속성 창의 지침** 값 칸 옆 `…` 버튼을 눌러 규칙과 출력 모양을 적습니다(저장해 둔 [지침 템플릿](#ai-templates) 을 골라 쓸 수도 있습니다). 실행마다 달라지는 요청은 카드의 [프롬프트 편집] 에 적습니다.
        4. 파일을 처리하려면 카드의 [프롬프트 첨부] 를 눌러 [파일 추가…] 로 고릅니다. 경로를 변수로 받으려면 식에 변수 이름을 직접 적습니다.
        5. 속성 창의 **AI 권한** 을 확인합니다. 문서를 읽어 답만 받으면 되는 일이면 **읽기** 로 낮추세요([AI 권한](#ai-permission)).
        6. 받을 타입의 변수를 만들고(예: 데이터 테이블) **결과** 칸에 변수 이름을 적습니다. 칸 옆 배지에 그 타입이 표시됩니다.
        7. 실행합니다. 어느 모델·추론 강도·권한으로 답했는지는 출력 패널의 로그에 한 줄로 남습니다.

        !!! tip "지침과 프롬프트를 나누는 기준"
            반복해서 쓰는 규칙("이런 열을 가진 표로", "회사명은 약칭표대로")은 **지침**에, 그때그때 바뀌는 것("이 파일을 처리해 줘", 변수에 든 문장)은 **프롬프트**에 둡니다. 프롬프트를 비우면 지침만으로 실행합니다.

        ### 편집 창 { #ai-editor }

        - 지침 편집 창(속성 창의 지침 `…` 버튼)과 [프롬프트 편집] 창은 **글로 쓰기**와 **식으로 쓰기 (VB · 변수 사용)** 를 오갈 수 있습니다. 글로 쓰면 따옴표나 줄 바꿈 식을 신경 쓰지 않아도 됩니다. 변수나 함수를 섞으려면 식으로 씁니다(예: `"다음 문장을 요약해 줘: " + 본문`).
        - 변수가 섞인 식은 글로 바꿔 보여 줄 수 없어 식 그대로 편집합니다.
        - [첨부] 창은 파일 경로를 VB 배열 식(`{"경로1", "경로2"}`)으로 다룹니다. [파일 추가…] 로 고르면 식에 경로가 추가되고, 창 아래에 파일 수와 없는 파일 수가 표시됩니다.

        ### 결과 타입 { #ai-result-type }

        결과 변수의 타입에 맞는 **출력 형식 안내가 프롬프트 끝에 자동으로 붙으므로**, "JSON 으로 답해 줘" 같은 말을 직접 쓰지 않아도 됩니다. 표라면 어떤 열이 필요한지만 지침에 적으면 됩니다.

        | 결과 변수의 타입 | 담기는 값 |
        |---|---|
        | `DataTable` | 표. 열 이름은 AI 가 정한 항목 이름(지침에 적은 헤더), 값은 모두 문자열 |
        | `String` | 답한 글 그대로 |
        | `Int32` · `Double` · `Decimal` 등 숫자 | 숫자 하나 |
        | `Boolean` | True / False |
        | `DateTime` | 날짜·시각 하나 |
        | `JObject` · `Dictionary(Of String, Object)` | 이름-값 묶음 하나 |
        | `JArray` · `List(Of String)` · `String()` | 값 목록 |
        | `Object` | 답의 모양에 따라 자동으로: 표 모양이면 `DataTable`, 이름-값 묶음이면 `JObject`, 목록이면 `JArray`, 그 밖에는 `String` |

        답이 그 타입으로 바뀌지 않으면(예: 표 변수인데 문장으로 답함) 먼저 스스로 고쳐 봅니다([답이 맞지 않거나 호출이 실패하면](#ai-retry)). 그래도 안 되면 오류로 끝나고, 오류 메시지에 AI 가 답한 글의 앞부분이 함께 나옵니다. 지침에 출력 모양을 더 분명히 적거나, 결과 변수를 잠시 `String` 으로 바꿔 답을 확인하세요. **오류 무시** 를 켜 두면 워크플로는 계속 진행되고 **원본 응답** 변수에 답이 그대로 남습니다.

        ### 표의 열을 정하기 { #ai-columns }

        표(`DataTable`)로 받을 때 열 이름을 정해 두지 않으면 AI 가 이름을 정합니다. 그러면 실행마다 "전화번호", "전화" 처럼 표기가 달라질 수 있고, 열 이름으로 값을 읽는 뒤 액티비티가 실패합니다. 열은 아래 순서로 정해집니다.

        | 순서 | 열을 정하는 것 | 값의 타입 |
        |---|---|---|
        | 1 | 속성 **출력 열** 에 적은 이름(`"회사명, 담당자, 전화번호"`) | 모두 글 |
        | 2 | **결과 변수에 이미 들어 있는 표**의 열. [데이터 테이블 만들기](datatable.md) 로 열을 잡아 둔 변수를 결과 칸에 넣으면 그 헤더대로 받습니다 | 그 표의 열 타입(숫자, 날짜, 참/거짓 열은 그 타입으로 바꿔 담습니다) |
        | 3 | 둘 다 없으면 AI 가 정합니다 | 모두 글 |

        - **지침이나 프롬프트에 적은 표 모양과 다르면 위 1, 2 가 먼저입니다.** 지침에 "열은 A, B, C 로" 라고 적혀 있어도 결과 변수의 헤더가 X, Y, Z 이면 X, Y, Z 로 받습니다.
        - 결과 변수의 표에 행이 들어 있어도 열을 따릅니다. 내용은 새 결과로 바뀝니다(앞의 행에 덧붙이지 않습니다). 그래서 반복문에서 같은 변수로 다시 받으면 매번 같은 열로 받습니다.
        - 정해 둔 열이 답에 없으면 **빈 열로 채우지 않습니다.** 먼저 열 이름만 고쳐 달라고 다시 요청하고([답이 맞지 않거나 호출이 실패하면](#ai-retry)), 그래도 없으면 오류로 알립니다. 오류 메시지에 없는 열과 답에 있던 열이 함께 나옵니다.
        - 정하지 않은 열이 답에 더 있으면 빼고 경고 로그로 알립니다. 대소문자나 띄어쓰기만 다른 이름("전화 번호")은 같은 열로 봅니다.
        - 결과 변수의 열을 따랐을 때는 출력 패널에 "결과 변수에 들어 있는 표의 열에 맞춰 받습니다: …" 가 남습니다.

        !!! warning "같은 변수를 다른 표에 다시 쓸 때"
            앞에서 표를 받은 변수를 전혀 다른 요청의 결과 칸에 다시 쓰면 앞 표의 열을 따르려다 "열이 다릅니다" 오류가 납니다. 요청마다 변수를 따로 두거나, **출력 열** 에 받을 열을 적으세요.

        ### 답이 맞지 않거나 호출이 실패하면 { #ai-retry }

        사람이 지켜보지 않는 실행에서 한 번의 실패로 워크플로가 멈추지 않도록 두 가지를 스스로 합니다. 일어날 때마다 출력 패널에 경고로 남고, 요약 줄 끝에 "호출 2회" 처럼 부른 횟수가 붙습니다.

        | 상황 | 하는 일 |
        |---|---|
        | 답이 결과 변수의 타입에 맞지 않음(표를 받아야 하는데 설명 글로 답함) | 그 답을 그대로 보내 **형식만** 다시 내 달라고 한 번 더 부릅니다. 지침과 첨부는 다시 보내지 않아 짧게 끝납니다 |
        | 호출이 실패함(AI 서비스가 잠깐 바쁨, 시간 초과 등) 또는 형식을 고치지 못함 | **재시도 횟수** 만큼 처음부터 다시 부릅니다(기본 1번, 잠깐 기다린 뒤) |
        | 로그인이 풀림 · 없는 모델 이름 · 쓸 수 없는 계정 | 다시 불러도 같으므로 바로 오류로 알립니다 |

        - 형식을 고칠 때 AI 가 "이 글에는 결과가 없다"고 판단하면(사과, 되묻는 글, 오류 문구) 고치지 않고 오류로 둡니다. 실패가 빈 표로 바뀌어 지나가는 일을 막기 위해서입니다.
        - 형식을 고쳐서 받았으면 **원본 응답** 에는 고쳐 받은 답이 들어가고, 처음 답은 경고 로그에 앞부분이 남습니다.
        - 문자열(`String`)·`Object` 변수는 어떤 답이든 담을 수 있어 형식을 다시 요청하지 않습니다.
        - 시간 초과도 다시 부르므로 가장 오래 걸리면 (재시도 횟수 + 1) × 시간 제한입니다. 다시 부르지 않게 하려면 **재시도 횟수** 를 0 으로 둡니다.

        ### 첨부할 수 있는 파일 { #ai-attachments }

        | 파일 | 처리 |
        |---|---|
        | 그림 `png` `jpg` `jpeg` `gif` `webp` (`bmp` `tif` `tiff` 는 PNG 로 바꿔서) | AI 가 그림을 직접 봅니다 |
        | `pdf` | AI 가 파일을 직접 읽습니다 |
        | 엑셀 `xlsx` `xlsm`, 워드 `docx`, 파워포인트 `pptx` | 내용을 글로 꺼내 함께 보냅니다(Excel·Word 가 설치되어 있지 않아도 됩니다) |
        | 글 `txt` `csv` `json` `xml` `md` `html` `log` 등 | 내용을 그대로 함께 보냅니다 |

        - 파일 하나에서 꺼낸 내용이 20만 자를 넘으면 앞부분만 보내고 로그로 알립니다.
        - 예전 형식의 `xls`(Excel 97-2003 통합 문서)는 읽지 못합니다. `xlsx` 로 저장해서 붙이세요.
        - 없는 경로나 폴더 경로가 들어 있으면 호출하기 전에 오류로 알립니다.
        - AI 도구는 붙인 파일의 **사본**을 받아 처리하고, 끝나면 사본을 지웁니다. AI 권한이 **읽기** 이면 원본 파일은 바뀌지 않습니다.

        ### AI 권한 { #ai-permission }

        속성 창의 **AI 권한** 이 AI 가 이 PC 에서 할 수 있는 일을 정합니다. CLI 연결에만 해당합니다.

        | AI 권한 | AI 가 할 수 있는 일 | 일하는 폴더 |
        |---|---|---|
        | 읽기 | 붙인 파일을 읽고 답합니다. 파일을 만들거나 고치지 못하고 프로그램도 실행하지 못합니다 | 임시 폴더(끝나면 지워짐) |
        | 읽기/쓰기 | 위에 더해, **작업 폴더 안**에서 파일을 만들고 고칩니다. 프로그램·명령은 실행하지 않습니다 | 작업 폴더 |
        | 모든 권한 (기본) | 위에 더해, 파일을 지우고 **프로그램·명령을 실행**합니다. 터미널에서 그 도구에 직접 시키는 것과 같습니다 | 작업 폴더 |

        - **작업 폴더** 는 속성 **작업 폴더** 에 적은 폴더이고, 비우면 프로젝트 폴더입니다. "결과를 보고서.xlsx 로 저장해 줘" 같은 요청으로 만든 파일이 여기 놓입니다.
        - 실행 로그의 요약 줄에 "읽기/쓰기"·"모든 권한" 이 함께 남습니다.
        - 답의 형식만 고쳐 달라고 다시 부를 때는 권한과 상관없이 읽기로 부릅니다.
        - API 연결에는 파일·프로그램을 다루는 도구가 없어 이 속성이 적용되지 않습니다.

        !!! danger "모든 권한은 사람이 지켜보지 않는 PC 에서 특히 조심하세요"
            모든 권한이면 AI 가 판단해서 파일을 지우거나 프로그램을 실행할 수 있고, **중간에 확인을 묻지 않습니다.** 붙인 문서(메일 본문, 받은 PDF, 웹에서 내려받은 파일)에 "이 명령을 실행하라" 같은 문장이 들어 있으면 AI 가 그것을 지시로 받아들일 위험도 있습니다. NeoRPA 가 그런 문장을 따르지 말라고 함께 알려 주지만 완전히 막지는 못합니다.

            - 문서를 읽어 답만 받는 일(분류, 추출, 요약)은 **읽기** 로 낮추세요.
            - 파일을 만들기만 하면 되는 일은 **읽기/쓰기** 로 충분합니다.
            - 모든 권한은 믿을 수 있는 입력만 다루는 워크플로에, 필요한 범위의 지침과 함께 쓰세요.
            - **재시도 횟수** 가 1 이상이면 실패한 작업을 처음부터 다시 합니다. 같은 일을 두 번 하면 안 되는 작업(메일 보내기 등)은 0 으로 두세요.

        ### API 키로 연결하기 { #ai-api }

        명령줄 도구에 로그인하기 어려운 PC(실행 전용 PC 등)에서는 API 키로 AI 를 부릅니다. 방법은 두 가지입니다.

        | | CLI 연결 + 로그인 | CLI 연결 + API 키 | API 연결 |
        |---|---|---|---|
        | **연결** 콤보 | Claude Code (CLI) 등 | Claude Code (CLI) 등 | Claude API · OpenAI API · Gemini API |
        | 준비 | 도구 설치 + 로그인 | 도구 설치 + API 키 | API 키만 |
        | 요금 | 그 도구의 구독·요금제 | API 사용량만큼 | API 사용량만큼 |
        | 파일 만들기·프로그램 실행 | AI 권한에 따라 가능 | **AI 권한에 따라 가능** | 할 수 없음(묻고 답만 받음) |
        | 첨부 | 그림 · PDF · 글 · 엑셀 · 워드 · 파워포인트 | 같음 | 같음. 그림·PDF 는 합쳐서 18MB 까지 |
        | 모델을 비우면 | 도구에서 마지막에 고른 모델 | 도구의 설정 | 기본 모델 |

        - **AI 가 파일을 만들거나 프로그램을 실행해야 하면** CLI 연결에 API 키를 연결하세요. 도구는 설치돼 있어야 하지만 로그인은 필요 없습니다.
        - **답만 받으면 되고 도구도 설치하기 어려우면** API 연결을 고르세요.

        키를 연결하는 순서는 같습니다.

        1. 키는 워크플로에 직접 적지 말고 Windows 자격 증명 관리자에 저장합니다([자격 증명 설정](security.md)).
        2. 워크플로 앞에서 **자격 증명 가져오기** 로 그 키를 읽어 보호된 문자열 변수에 담습니다.
        3. AI 호출의 속성 **API 키(보호)** 에 그 변수를 연결합니다. 카드 상태 줄이 "API 키 연결됨" 으로 바뀝니다(CLI 연결이면 "API 키 연결됨 (로그인 없이 실행)").

        - 키는 그 AI 서비스의 것이어야 합니다(Claude Code 에는 Anthropic 의 키, Codex 에는 OpenAI 의 키, Gemini 에는 Google 의 키).
        - CLI 연결에 키를 연결하면 그 PC 에 로그인된 계정 대신 **그 키로** 실행하고 요금도 그 키에 청구됩니다. 실행 로그의 요약 줄에 "API 키" 가 남습니다.
        - API 연결에서 키를 연결하지 않으면 설계할 때 경고가 표시되고, 실행하면 오류로 끝납니다.
        - 오류 메시지의 "Invalid API key"·"HTTP 401"·"API key not valid" 는 키가 틀렸거나 그 키로 그 모델을 쓸 수 없다는 뜻입니다.
        - 서비스가 잠깐 바쁘거나(429·5xx) 연결이 끊기면 **재시도 횟수** 만큼 다시 부릅니다.

        ### 지침 템플릿 { #ai-templates }

        자주 쓰는 지침을 이름을 붙여 저장해 두고 여러 AI 호출 액티비티가 함께 씁니다. **템플릿을 고치면 그 템플릿을 쓰는 모든 액티비티가 다음 실행부터 바뀐 지침으로 실행됩니다.**

        템플릿을 쓰는 방법은 두 가지입니다.

        - 속성 창의 **지침 템플릿** 콤보에서 고릅니다.
        - 지침 편집 창(속성 창의 지침 값 칸 옆 `…` 버튼) 위쪽의 템플릿 줄에서 고르거나 만듭니다.

        | 템플릿 줄 | 하는 일 |
        |---|---|
        | 템플릿 콤보 | 이 액티비티가 쓸 템플릿을 고릅니다. 고르면 그 내용이 아래에 읽기 전용으로 보입니다. "(사용 안 함)" 을 고르면 뗍니다 |
        | [템플릿으로 저장…] | 지금 적은 지침을 새 템플릿으로 저장하고(이름을 정합니다) 이 액티비티가 그 템플릿을 쓰게 합니다 |
        | [템플릿 관리…] | 저장된 템플릿의 이름·내용을 고치거나 삭제하고, 새로 만듭니다 |

        - 템플릿을 고른 뒤 지침 칸에 글을 더 적으면 **이 액티비티에만** 템플릿 뒤에 덧붙습니다. 공통 규칙은 템플릿에, 이 액티비티만의 조건은 지침에 두면 됩니다.
        - 실행하면 출력 패널에 "지침 템플릿 '이름' 을(를) 사용합니다" 가 남습니다.
        - 템플릿은 이 PC 의 데이터 폴더 `ai-templates` 에 템플릿마다 글 파일(`이름.md`) 하나로 저장됩니다.
        - 템플릿은 글로 저장합니다. 변수가 섞인 식은 템플릿으로 저장할 수 없습니다.

        !!! warning "워크플로를 다른 PC 에서 실행할 때"
            템플릿의 글은 워크플로 파일에 들어 있지 않고 실행할 때 읽습니다. 그래서 **실행하는 PC 에도 같은 이름의 템플릿이 있어야 합니다.** 없으면 "지침 템플릿을 찾을 수 없습니다" 오류로 멈춥니다. 템플릿을 만든 PC 의 `ai-templates` 폴더를 실행 PC 의 같은 위치로 복사하세요. 템플릿이 없는 PC 에서 워크플로를 열면 콤보에 "(이 PC 에 없음)" 으로 표시되고 경고가 나옵니다.

        !!! warning "템플릿을 고치거나 지우기 전에"
            템플릿을 고치면 그 템플릿을 쓰는 다른 워크플로의 동작도 함께 바뀝니다. 지우면 그 템플릿을 쓰는 액티비티가 실행할 때 오류로 멈춥니다.

        ### 연결 상태 줄 { #ai-status }

        카드의 **연결** 콤보 아래 한 줄이 선택한 도구의 준비 상태를 보여 줍니다. 줄을 클릭하면 다시 확인합니다.

        | 표시 | 뜻과 조치 |
        |---|---|
        | 초록 점 · 로그인됨 | 준비 완료. 그 도구가 지금 쓰는 모델은 아래 **모델** 드롭다운의 첫 항목 "CLI 설정 (…)" 에 표시됩니다 |
        | 초록 점 · API 키 연결됨 | API 연결이고 키가 연결되어 있습니다(키가 맞는지는 실행해 봐야 압니다) |
        | 초록 점 · API 키 연결됨 (로그인 없이 실행) | CLI 연결에 키를 연결했습니다. 로그인 여부와 상관없이 그 키로 실행합니다 |
        | 갈색 점 · API 키 필요 | API 연결인데 키가 없습니다. 속성 창의 **API 키(보호)** 에 연결하세요 |
        | 회색 점 · 설치됨 | 도구는 있지만 로그인 여부를 미리 확인하지 못했습니다. 실행해 보면 알 수 있습니다 |
        | 갈색 점 · 로그인 필요 · 터미널에서 … 실행 | 터미널(명령 프롬프트)에서 표시된 명령을 실행해 로그인한 뒤 줄을 클릭합니다 |
        | 빨간 점 · 설치되지 않음 · … | 표시된 설치 명령을 터미널에서 실행한 뒤 줄을 클릭합니다 |

        ### 문제 해결 { #ai-troubleshooting }

        - **터미널에서는 로그인되어 있는데 카드는 "로그인 필요" 입니다** — AI 도구는 NeoRPA 를 실행한 Windows 계정과 환경 변수를 그대로 물려받습니다. 로그인할 때와 **같은 Windows 계정**으로 NeoRPA 가 실행되고 있는지(관리자 권한 확인 창에서 다른 계정으로 승인했다면 그 계정에서 로그인해야 합니다), 도구의 설정 폴더를 환경 변수(`CLAUDE_CONFIG_DIR`, `CODEX_HOME`)로 옮겨 쓰고 있지 않은지 확인하세요. 옮겨 쓰는 경우 NeoRPA 도 같은 환경 변수로 실행해야 합니다.
        - **설치했는데 "설치되지 않음" 입니다** — 도구를 기본 위치가 아닌 곳에 설치했으면 환경 변수 `NEORPA_AI_CLI_CLAUDE`(Codex 는 `NEORPA_AI_CLI_CODEX`, Gemini 는 `NEORPA_AI_CLI_GEMINI`)에 실행 파일의 전체 경로를 넣고 NeoRPA 를 다시 시작합니다.
        - **"…초 안에 응답하지 않아 중단했습니다" 로 끝납니다** — 파일이 크거나 추론 강도가 높으면 3분을 넘길 수 있습니다. **시간 제한(초)** 을 늘리거나 추론 강도를 낮추고, 첨부를 줄입니다.
        - **출력 패널에 "AI 호출을 다시 시도합니다" 경고가 보입니다** — 호출이 한 번 실패해 다시 부른 것입니다. 결과가 정상이면 조치할 것은 없습니다. 자주 보이면 경고에 적힌 사유를 보고, 시간 초과면 **시간 제한(초)** 을 늘리고 형식이 맞지 않는 것이면 지침의 출력 모양을 더 분명히 적습니다.
        - **표가 아니라 문장으로 답합니다** — 결과 변수의 타입이 `String` 이나 `Object` 인지 확인하세요. 표를 받으려면 `DataTable` 변수를 연결하고 지침에 필요한 열을 적습니다.
        - **실행할 때마다 답이 조금씩 다릅니다** — AI 의 답은 같은 입력에도 달라질 수 있습니다. 지침에 열 이름·표기 규칙·예시를 구체적으로 적고, 뒤 단계에서 값을 한 번 검증하세요.
- key: system
  name: System
  title: System (구조 · 프로세스)
  summary: WF 구조·프로세스 유틸
  intro: 플로차트·스테이트머신 등 WF 구조와 프로세스·로그 유틸.
  namespace_hint:
  - DX.TEST.Activities
  - MeetupWfIntro.MeetupActivityLibrary.Activities.Meetup
  activities:
    Flowchart:
      desc: 노드와 연결선으로 흐름을 구성하는 플로차트 컨테이너입니다.
    FlowSwitch:
      desc: 플로차트에서 식의 값에 따라 여러 갈래로 분기합니다.
    FlowDecision:
      desc: 플로차트에서 조건에 따라 참/거짓 두 갈래로 분기합니다.
    InvokeMethod:
      desc: 지정한 객체나 형식의 메서드를 호출합니다.
    State:
      desc: 스테이트 머신의 상태를 정의합니다(진입/이탈 동작과 전이 포함).
    FinalState:
      desc: 스테이트 머신의 종료 상태를 정의합니다.
    StateMachine:
      desc: 상태와 전이로 흐름을 구성하는 스테이트 머신 컨테이너입니다.
    PrintLogMessage:
      desc: 지정한 메시지를 실행 로그에 출력합니다.
      props:
        Message:
          desc: 기록할 로그 메시지 내용.
        LogType:
          desc: '기록할 로그의 수준: Info, Warning, Error, Fatal, Trace 중 하나.'
    KillProcess:
      desc: 지정한 프로세스를 강제로 종료합니다.
      props:
        process:
          desc: 종료할 대상 프로세스.
        processName:
          desc: 종료할 대상 프로세스 이름.
    GetProcesses:
      desc: 현재 실행 중인 프로세스 목록을 가져옵니다.
      props:
        Processes:
          desc: 조회된 프로세스 목록(출력).
    AddLogFields:
      desc: 이후 실행 로그(JSON)에 사용자 정의 필드를 덧붙입니다. 다음 호출 시 새 값으로 교체됩니다.
      props:
        Arguments:
          show: true
    RemoveLogFields:
      desc: '`AddLogFields`로 실행 로그에 덧붙인 사용자 정의 필드 중 지정한 이름의 필드만 제거합니다. 인자 목록의 각 값을 평가한 결과가 제거할 필드 이름으로 사용됩니다.'
      props:
        Arguments:
          show: true
          desc: 제거할 로그 필드 이름 목록(디자이너 화면에서 편집). 각 값 식의 결과가 필드 이름입니다.
- key: db
  name: DB
  title: DB
  summary: 데이터베이스 질의
  intro: 데이터베이스에 연결해 질의를 실행합니다.
  namespace_hint:
  - DX.TEST.Activities
  - MeetupWfIntro.MeetupActivityLibrary.Activities.Meetup
  activities:
    DBConnectToDT:
      desc: 데이터베이스에 연결해 조회 쿼리를 실행하고 결과를 DataTable로 가져옵니다.
      props:
        conn:
          desc: 데이터베이스 연결 문자열.
        DBType:
          desc: 연결할 데이터베이스의 종류.
        query:
          desc: 실행할 SQL 쿼리.
    DBQueryExecute:
      desc: 데이터베이스에 연결해 INSERT/UPDATE/DELETE 등 쿼리를 실행합니다.
      props:
        conn:
          desc: 데이터베이스 연결 문자열.
        DBType:
          desc: 연결할 데이터베이스의 종류.
        query:
          desc: 실행할 SQL 쿼리.
- key: security
  name: 보안
  title: 보안 (자격 증명)
  summary: Windows 자격 증명 관리자에 비밀번호 보관
  intro: '비밀번호를 워크플로 파일에 적지 않기 위한 액티비티. Windows 자격 증명 관리자(제어판 › 자격 증명 관리자 › Windows 자격 증명)에 `NeoRPA:{이름}` 으로 저장한 자격 증명을 읽어 보호된 비밀번호(SecureString)로 돌려주고, 다른 액티비티의 `SecurePassword`·`SecureValue`·`SecureConn` 인자에 연결합니다.'
  namespace_hint:
  - DX.TEST.Activities
  activities:
    GetCredential:
      desc: 'Windows 자격 증명 관리자에서 이름으로 자격 증명을 읽어 사용자 이름과 보호된 비밀번호(SecureString)를 돌려줍니다. 대상은 `NeoRPA:{이름}` 으로 저장되어 있어야 합니다(없으면 오류).'
      props:
        CredentialName:
          desc: '자격 증명 이름(접두 `NeoRPA:` 를 뺀 이름).'
        Username:
          desc: 저장된 사용자 이름(출력).
        SecurePassword:
          desc: 저장된 비밀번호(출력, SecureString). HTTP 요청·메일·DB·텍스트 입력 액티비티의 보호된 인자에 연결합니다.
    SetCredential:
      desc: 자격 증명을 Windows 자격 증명 관리자에 저장합니다. 처음 한 번 저장할 때 쓰고, 비밀번호를 직접 적은 워크플로는 저장 뒤 지웁니다.
      props:
        CredentialName:
          desc: 저장할 자격 증명 이름.
        Username:
          desc: 저장할 사용자 이름.
        Password:
          desc: 저장할 비밀번호(평문). 직접 적으면 워크플로 파일에 남아 설계 시점에 경고가 납니다.
        SecurePassword:
          desc: 저장할 비밀번호(SecureString). 있으면 평문보다 우선합니다.
    DeleteCredential:
      desc: Windows 자격 증명 관리자에서 자격 증명을 지웁니다.
      props:
        CredentialName:
          desc: 지울 자격 증명 이름.
        Deleted:
          desc: 실제로 지웠으면 true, 없었으면 false(출력).
- key: outlook
  name: OutLook
  title: OutLook
  summary: Outlook 메일
  intro: 설치된 Outlook을 통해 메일을 가져오고 보내고 삭제합니다.
  namespace_hint:
  - DX.TEST.Activities
  - MeetupWfIntro.MeetupActivityLibrary.Activities.Meetup
  activities:
    OutlookGetMailMessage:
      desc: 설치된 Outlook에서 지정한 폴더의 메일을 가져옵니다.
      props:
        Filter:
          desc: 메일을 걸러낼 필터 조건.
        FilterByIDs:
          desc: 지정한 메일 ID 목록만 가져오도록 거르는 조건.
        MarkAsRead:
          desc: 가져온 메일을 읽음으로 표시할지 여부.
        OnlyUnreadMessage:
          desc: 읽지 않은 메일만 가져올지 여부.
        OrderByDate:
          desc: 메일을 날짜 기준으로 정렬하는 기준.
        Top:
          desc: 가져올 최대 메일 개수.
        Account:
          desc: 메일에 사용할 Outlook 계정(메일 주소).
        MailFolder:
          desc: 메일을 가져올 대상 폴더 이름.
        Messages:
          desc: 가져온 메일 메시지 목록(출력).
    OutlookSendMessage:
      desc: 설치된 Outlook을 통해 메일을 보냅니다(첨부 지원).
      props:
        TO:
          desc: 메일 수신자 주소.
        CC:
          desc: 메일 참조(CC) 수신자 주소.
        Body:
          desc: 메일 본문 내용.
        Subject:
          desc: 메일 제목.
        Attachment:
          desc: 메일에 첨부할 파일 경로.
        Account:
          desc: 메일에 사용할 Outlook 계정(메일 주소).
    OutlookDeleteMessage:
      desc: 설치된 Outlook에서 지정한 메일을 삭제합니다.
      props:
        MailMessage:
          desc: 삭제할 대상 메일 메시지.
        PermanentlyDelete:
          desc: 메일을 휴지통을 거치지 않고 영구 삭제할지 여부.
